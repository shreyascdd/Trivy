name: Trivy Scan for Frontend and Backend

on:
  workflow_dispatch:

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Install Trivy once
      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          version: latest

      # --- Frontend ---
      - name: Build frontend image
        run: docker build -t myorg/frontend:latest ./frontend

      - name: Run Trivy scan for frontend
        run: |
          trivy image \
            --format sarif \
            --output trivy-frontend.sarif \
            myorg/frontend:latest || true

      - name: Upload frontend SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif

      # --- Backend ---
      - name: Build backend image
        run: docker build -t myorg/backend:latest ./backend

      - name: Run Trivy scan for backend
        run: |
          trivy image \
            --format sarif \
            --output trivy-backend.sarif \
            myorg/backend:latest || true

      - name: Upload backend SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
